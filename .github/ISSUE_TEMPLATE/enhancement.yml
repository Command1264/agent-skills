name: 既有 Skill 功能改進
description: 改善已存在 Skill 的行為、介面或使用體驗。
title: "feat(<skill>): "
labels:
  - needs-triage
  - type:enhancement
body:
  - type: markdown
    attributes:
      value: 請勿填入 API key、完整住家地址、私人設定或未去識別的外部 API response。
  - type: input
    id: skill
    attributes:
      label: Skill 名稱
      placeholder: google-routes
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 目前行為與問題
      description: 說明目前可觀察到的行為，以及它造成的限制。
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: 希望的行為
      description: 提供可驗收的結果，並指出相容性或遷移需求。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
      description: 不知道時可填「尚未評估」。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 公開資料確認
      options:
        - label: 我已確認內容不含 secret、私人位置或未去識別的 response。
          required: true
